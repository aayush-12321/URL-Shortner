[project]
name = "url-shortner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aayush-12321", email = "aayushparajuli23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0.1,<5.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
]

[project.scripts]
url-shortner = "url_shortner:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
