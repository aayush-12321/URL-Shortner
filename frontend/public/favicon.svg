<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background card container with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="8" opacity="0.6" />

  <!-- Link icon graphic rotated -45 deg -->
  <g transform="translate(256 256) rotate(-45) translate(-256 -256)">
    <!-- Left Loop -->
    <path d="M 210,200 H 160 C 129.07,200 104,225.07 104,256 C 104,286.93 129.07,312 160,312 H 210" 
          fill="none" stroke="url(#linkGrad)" stroke-width="40" stroke-linecap="round" />

    <!-- Right Loop -->
    <path d="M 302,312 H 352 C 382.93,312 408,286.93 408,256 C 408,225.07 382.93,200 352,200 H 302" 
          fill="none" stroke="url(#accentGrad)" stroke-width="40" stroke-linecap="round" />

    <!-- Link Connection bar -->
    <line x1="200" y1="256" x2="312" y2="256" stroke="#38bdf8" stroke-width="36" stroke-linecap="round" />
  </g>
</svg>
